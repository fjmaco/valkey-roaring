name: Benchmark

# Full census1881 benchmark (~12M commands). Refreshes the README table the
# same way redis-roaring's performance job does. Runs weekly and on demand —
# not per push, to keep CI fast and the numbers from a consistent environment.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/performance

      - name: Build image and start Valkey with the module
        run: docker compose up -d --build

      - name: Wait for the server
        run: |
          for _ in $(seq 1 60); do
            if [ "$(docker compose exec -T valkey valkey-cli PING 2>/dev/null)" = "PONG" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Run full benchmark and update README
        run: bash tests/performance.sh

      - name: Commit updated README
        run: |
          if git diff --quiet README.md; then
            echo "No benchmark changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update performance benchmarks [skip ci]"
          git push
