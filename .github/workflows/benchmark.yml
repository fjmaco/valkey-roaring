name: Benchmark

# Full census1881 benchmark (~12M commands). Refreshes the README table the
# same way redis-roaring's performance job does. Runs only when something
# that can affect the numbers changes (module code, dependencies, the
# harness, or the runtime image) — benchmarking unchanged code would only
# record runner noise.
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - "docker-compose.yml"
      - "tests/performance/**"
      - "tests/performance.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      # With BENCHMARK_PUSH_TOKEN set (a fine-grained PAT with Contents write,
      # owned by a repo admin), the push bypasses branch protection; with the
      # default token the commit step below falls back to an artifact.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.BENCHMARK_PUSH_TOKEN || github.token }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/performance

      - name: Build image and start Valkey with the module
        run: docker compose up -d --build

      - name: Wait for the server
        run: |
          for _ in $(seq 1 60); do
            if [ "$(docker compose exec -T valkey valkey-cli PING 2>/dev/null)" = "PONG" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Run full benchmark and update README
        run: bash tests/performance.sh

      - name: Commit updated README
        run: |
          if git diff --quiet README.md; then
            echo "No benchmark changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update performance benchmarks [skip ci]"
          if ! git push; then
            echo "Push blocked by branch protection — README uploaded as artifact instead." >> "$GITHUB_STEP_SUMMARY"
            echo "blocked=true" >> "$GITHUB_ENV"
          fi

      - name: Upload README as artifact when push is blocked
        if: env.blocked == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-readme
          path: README.md
          retention-days: 30
