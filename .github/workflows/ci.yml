name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Build, unit and property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen dependency)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --check

      - name: Build module
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --release --all-targets --locked -- -D warnings

      - name: Unit and property tests
        run: cargo test --release --locked

  integration:
    name: Integration and performance smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tests/performance

      - name: Build image and start Valkey with the module
        run: docker compose up -d --build

      - name: Wait for the server
        run: |
          for _ in $(seq 1 60); do
            if [ "$(docker compose exec -T valkey valkey-cli PING 2>/dev/null)" = "PONG" ]; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs
          exit 1

      - name: Integration suite
        run: bash tests/integration.sh

      - name: Performance smoke run
        run: PERF_MAX_FILES=5 bash tests/performance.sh

      - name: Server logs on failure
        if: failure()
        run: docker compose logs

  coverage:
    name: Unit-layer coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen dependency)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage report
        run: cargo llvm-cov --release --locked --lcov --output-path lcov.info

      - name: Coverage summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cargo llvm-cov report --release >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info

      # No-op until the CODECOV_TOKEN repository secret is added (free for
      # public repos at codecov.io); never fails the build.
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
