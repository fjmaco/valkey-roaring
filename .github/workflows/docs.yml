name: Docs

# The `pull_request` trigger validates the build half of the pipeline before
# it merges — including changes to this file, which the main-only push
# trigger would otherwise first execute after the fact. Deployment stays
# main-only: the github-pages environment admits no other branch.
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"        # the performance page includes the README table
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  # Per-PR on pull_request, so a validation run never cancels a live
  # deployment from main.
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Build site
        run: |
          cd docs
          npm ci
          npm run docs:build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
