name: Fuzz

# Short fuzz pass on every PR/push; longer nightly run on a schedule.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [import_bytes, parity_ops, bitop_kernels]
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (bindgen dependency)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Restore corpus
        uses: actions/cache@v4
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Set run length
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "FUZZ_TIME=600" >> "$GITHUB_ENV"
          else
            echo "FUZZ_TIME=60" >> "$GITHUB_ENV"
          fi

      - name: Fuzz ${{ matrix.target }}
        # Explicit triple: prebuilt cargo-fuzz is musl-linked and would
        # otherwise default to a musl target, which ASan does not support.
        run: cargo fuzz run ${{ matrix.target }} --target x86_64-unknown-linux-gnu -- -max_total_time=$FUZZ_TIME

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
