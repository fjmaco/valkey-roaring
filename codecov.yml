# Coverage is measured on the `cargo test` unit/property layer only.
#
# The files ignored below are Valkey-context-bound glue — command handlers,
# module registration, RDB callbacks, argument parsing. Every function in
# them requires a live server (open_key, replies, replication), so unit
# instrumentation cannot reach them. They are exercised end-to-end by the
# 283-assertion integration suite that CI runs against a dockerized Valkey
# in the same pipeline; that layer is simply not visible to coverage
# tooling. commands_bitop.rs stays in scope: its BITOP kernels are
# unit-covered and excluding them would discard real signal.
ignore:
  - "src/commands.rs"
  - "src/lib.rs"
  - "src/parse.rs"

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true
